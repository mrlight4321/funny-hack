<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مقلب السريع 😂</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: Tahoma; padding-top: 50px; }
        video { width: 400px; border-radius: 10px; border: 3px solid #ff4757; transform: scaleX(-1); } /* عشان الصورة ماتبقى معكوسة */
    </style>
</head>
<body>

    <h1>جاري فحص الجهاز... 🕵️‍♂️</h1>
    <p>من فضلك اضغط "السماح" عشان اللعبة تبدأ!</p>

    <!-- مكان عرض الكاميرا -->
    <video id="webcam" autoplay playsinline></video>

    <script>
        // طلب إذن الكاميرا وتشغيلها
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                var videoElement = document.getElementById('webcam');
                videoElement.srcObject = stream;
            })
            .catch(function(error) {
                alert("للأسف رفضت الإذن، المقلب باظ! ❌");
            });
    </script>

</body>
</html>
