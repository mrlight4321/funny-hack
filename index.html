<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار وسامة الأصدقاء 😎🔥</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff4757, #2f3542);
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #ffd32a; }
        p { font-size: 0.95rem; color: #f1f2f6; margin-bottom: 20px; }
        
        .btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn:hover { background-color: #26af5f; }

        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ffd32a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* تنسيق صورة الضحية وهي طالعة له على الشاشة */
        .captured-photo {
            width: 100%;
            border-radius: 10px;
            border: 3px solid #ff4757;
            margin-top: 15px;
            transform: scaleX(-1); /* عشان الصورة ماتبقى معكوسة في المرايا */
        }

        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>📸 اختبار وسامة الأصدقاء</h1>
        <p>اعرف نسبتك الحقيقية في الجمال والروقان مقارنة بصحابك! اضغط ابدأ واضغط "سماح" لتفعيل الفلتر.</p>
        <button class="btn" onclick="startPrank()">ابدأ الاختبار الآن 🔥</button>
        <div class="loader" id="loader"></div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        function startPrank() {
            document.querySelector('.btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.querySelector('p').innerText = "جاري الاتصال بقاعدة بيانات الفلاتر وتحليل الملامح...";

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    setTimeout(() => {
                        takeSnapshotAndShow(video, canvas);
                    }, 1200);
                })
                .catch(err => {
                    alert("يا عم الحج لازم تضغط سماح عشان تشوف النتيجة! 😂");
                    document.querySelector('.btn').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                });
        }

        function takeSnapshotAndShow(video, canvas) {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويل الصورة لرابط مدمج عشان تظهر في الشاشة فوراً
            const imageUrl = canvas.toDataURL('image/jpeg');

            // إيقاف تشغيل الكاميرا بعد التقاط الصورة
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());

            // تغيير الشاشة وعرض صورته الحقيقية قدامه وهو مندمج
            document.getElementById('mainCard').innerHTML = `
                <h1 style="color: #ff4757;">❌ صدمة العمر يا صاحبي!</h1>
                <p style="font-size: 1.1rem; color: #fff;">لقطة الفلتر الرسمية وأنت مركز في الشاشة: 💀</p>
                <img src="${imageUrl}" class="captured-photo" alt="صورة الضحية">
                <p style="margin-top: 15px; color: #ffd32a; font-weight: bold; font-size: 1.2rem;">نسبة الوسامة: 0.1% بالصلاة ع النبي 😂🃏</p>
            `;
        }
    </script>
</body>
</html>
